name: WebSub ping

# Runs after CI finishes on main. Deploys happen outside CI (`pnpm deploy`), so this waits until
# the live feed matches the feed built from the same commit, then notifies the WebSub hub.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: websub-ping
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ping:
    name: Notify WebSub hub
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      FEED_URL: https://www.hellalabs.dev/feed.xml
      HUB_URL: https://pubsubhubbub.appspot.com/
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.6.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Wait for the deployed feed to match this build
        id: wait
        run: |
          expected=$(sha256sum dist/feed.xml | cut -d' ' -f1)
          for _ in $(seq 1 60); do
            live=$(curl -fsSL "$FEED_URL" | sha256sum | cut -d' ' -f1 || true)
            if [ "$live" = "$expected" ]; then
              echo "matched=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 30
          done
          echo "::notice::Live feed never matched this build (not deployed, or no feed change); skipping ping."

      - name: Ping WebSub hub
        if: steps.wait.outputs.matched == 'true'
        run: |
          curl -fsS -X POST "$HUB_URL" \
            --data-urlencode "hub.mode=publish" \
            --data-urlencode "hub.url=$FEED_URL"
